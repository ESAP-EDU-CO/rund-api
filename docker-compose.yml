services:
  rund-api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: rund-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Mount logs and tmp directories for persistence
      - ./logs:/var/www/html/logs
      - ./tmp:/var/www/html/tmp      
      # Development only: mount app directory for live changes
      - ./app:/var/www/html
    environment:
      - PHP_OPCACHE_ENABLE=1
      - PHP_OPCACHE_REVALIDATE_FREQ=0
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
      - ENVIRONMENT=development
      # Production environment variables
      - API_BASE_URL=http://localhost:3000
      - EXTERNAL_API_URL=http://localhost:8080
      # For production, change to:
      # - API_BASE_URL=http://172.16.234.52:3000
      # - EXTERNAL_API_URL=http://172.16.234.52:8080
    networks:
      - rund-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  rund-network:
    driver: bridge

# For production deployment, you might want to add:
# volumes:
#   rund-logs:
#     driver: local
#   rund-tmp:
#     driver: local